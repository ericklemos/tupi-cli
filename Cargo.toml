[workspace]
resolver = "2"
members = [
    "crates/tupi-domain",
    "crates/tupi-kernel",
    "crates/tupi-providers",
    "crates/tupi-app",
    "crates/tupi-tui",
    "crates/tupi-store",
    "crates/tupi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tupi-domain = { path = "crates/tupi-domain" }
tupi-kernel = { path = "crates/tupi-kernel" }
tupi-providers = { path = "crates/tupi-providers" }
tupi-app = { path = "crates/tupi-app" }
tupi-tui = { path = "crates/tupi-tui" }
tupi-store = { path = "crates/tupi-store" }

tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
dotenvy = "0.15"
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "4.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
thiserror = "2.0.21"
anyhow = "1"
ratatui = "0.30.2"
unicode-width = "0.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
