[workspace]
resolver = "2"
members = [
    "crates/tupi-domain",
    "crates/tupi-kernel",
    "crates/tupi-providers",
    "crates/tupi-app",
    "crates/tupi-tui",
    "crates/tupi-web",
    "crates/tupi-store",
    "crates/tupi-tools",
    "crates/tupi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tupi-domain = { path = "crates/tupi-domain" }
tupi-kernel = { path = "crates/tupi-kernel" }
tupi-providers = { path = "crates/tupi-providers" }
tupi-app = { path = "crates/tupi-app" }
tupi-tui = { path = "crates/tupi-tui" }
tupi-web = { path = "crates/tupi-web" }
tupi-store = { path = "crates/tupi-store" }
tupi-tools = { path = "crates/tupi-tools" }

tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
dotenvy = "0.15"
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
redb = "4.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
anyhow = "1"
ratatui = "0.30.2"
tui-markdown = "0.3.13"
unicode-width = "0.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-kotlin-ng = "1.1.0"
streaming-iterator = "0.1"
petgraph = "0.8.3"
notify = "8.2.2"
regex = "1.10"
grep-searcher = "0.1"
grep-regex = "0.1"
blake3 = "1.5"
ignore = "0.4"
libc = "0.2"
tempfile = "3.10"
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
