[package]
name = "tupi"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tupi"
path = "src/main.rs"

[dependencies]
tupi-app.workspace = true
tupi-domain.workspace = true
tupi-kernel.workspace = true
tupi-providers.workspace = true
tupi-tui.workspace = true
tupi-web.workspace = true
tupi-store.workspace = true
tupi-tools.workspace = true
tupi-infer = { workspace = true, default-features = false }
anyhow.workspace = true
async-trait.workspace = true
dotenvy.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# O default é o mesmo de antes: `local-models` (llama.cpp) sempre entra e `cuda`
# escolhe o backend. A diferença é que agora dá para desligar:
# `cargo build -p tupi --no-default-features` compila sem `llama-cpp-2`, que é o
# maior custo de build nativo do binário (ver docs/perf/baseline.md).
default = ["local-models", "cuda"]
local-models = ["tupi-infer/local-models"]
cuda = ["tupi-infer/cuda"]
metal = ["tupi-infer/metal"]
vulkan = ["tupi-infer/vulkan"]

[dev-dependencies]
tempfile.workspace = true
