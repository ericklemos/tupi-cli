[package]
name = "tupi"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tupi"
path = "src/main.rs"

[dependencies]
tupi-app.workspace = true
tupi-domain.workspace = true
tupi-kernel.workspace = true
tupi-providers.workspace = true
tupi-tui.workspace = true
tupi-web.workspace = true
tupi-store.workspace = true
tupi-tools.workspace = true
tupi-infer = { workspace = true, default-features = false }
tupi-transcribe = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
dotenvy.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
# Alocador global opcional para medir A/B (`crates/tupi/tests/alloc_ab.rs`).
# Fora da feature `mimalloc` o binário usa o alocador do sistema.
mimalloc = { version = "0.1", optional = true }

[features]
# Uma feature por família de IA local; fora delas o binário não tem IA nenhuma.
#
# - `local-models`: embedder (espaço vetorial e docs) e gerador (resumos).
# - `transcribe`: Whisper/Sherpa do `tupi transcribe`.
# - `cuda`/`metal`/`vulkan`: backend de GPU. Cada uma implica as duas acima,
#   porque GPU sem inferência compilada não serve para nada.
#
# O default continua CUDA (`cargo build` = binário com tudo). Build de CPU sem
# IA local é `cargo build -p tupi --no-default-features`; inferência em CPU sem
# transcrição é `--no-default-features --features local-models`.
# O default é o build leve de CPU: `cargo build` compila `local-models` sem
# backend de GPU nenhum. GPU é opt-in explícito (`--features cuda`), porque
# `llama.cpp` com CUDA exige toolkit e host compatível — quem só quer inferência
# em CPU não paga por isso. Build sem IA local é
# `cargo build -p tupi --no-default-features`; transcrição sem GPU é
# `--features transcribe`; GPU com tudo é `--features cuda` (ou `metal`/`vulkan`).
default = ["local-models"]
local-models = ["tupi-infer/local-models"]
transcribe = ["dep:tupi-transcribe"]
cuda = ["local-models", "transcribe", "tupi-infer/cuda", "tupi-transcribe/cuda"]
metal = ["local-models", "transcribe", "tupi-infer/metal", "tupi-transcribe/metal"]
vulkan = ["local-models", "transcribe", "tupi-infer/vulkan", "tupi-transcribe/vulkan"]
# Troca o alocador global por `mimalloc` (opt-in, nunca no default): existe só
# para o A/B medido em docs/perf/allocator-and-linker.md.
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
tempfile.workspace = true
