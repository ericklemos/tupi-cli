[package]
name = "tupi-infer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tupi-kernel.workspace = true
async-trait.workspace = true
reqwest.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
encoding_rs = "0.8"
llama-cpp-2 = { version = "0.1.161", optional = true }

[features]
default = []
local-models = ["dep:llama-cpp-2"]
# O backend escolhe a GPU, mas nunca vem sem o código de inferência: `llama.cpp`
# com CUDA e sem `local-models` carregaria a dependência sem uso.
cuda = ["local-models", "llama-cpp-2/cuda"]
metal = ["local-models", "llama-cpp-2/metal"]
vulkan = ["local-models", "llama-cpp-2/vulkan"]

[dev-dependencies]
tempfile.workspace = true
